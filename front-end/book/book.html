<!DOCTYPE html>

<head>
    <title>book page</title>
    <link rel="stylesheet" href="book.css">
    <link rel="stylesheet" href="seats.css">
    <script type="module" src="book.js" defer></script>
</head>

<body>
    <div class="left">
        <p class="stage">Stage</p>
        <div id="seat-map" class="seat-map"></div>
        <ul class="seat-legend">
            <li><span class="seat zone-std_low legend-chip">available</span></li>
            <li><span class="seat selected legend-chip">selected</span></li>
            <li><span class="seat state-booked legend-chip">booked</span></li>
            <li><span class="seat state-blocked legend-chip">unavailable</span></li>
            <li><span class="seat accessible legend-chip">wheelchair space</span></li>
        </ul>
    </div>
    <div class="right">
        <p id="price-status" role="status"></p>
        <div class="right-top">
            <h2 id="operaTitle">Opera Selected:Azusalina write this project</h2>
            <h3 id="showtimeTitle">Showtime:Loading...</h3>
        </div>
        <ul id="zone-prices" class="zone-prices"></ul>
        <h3>Selected seats(max 8)</h3>
        <ul id="selected-list" class="selected-list"></ul>
        <div class="right-low">
            <span id="sum-price">Total Price :HKD$0.00</span>
            <button type="button" id="refresh-seats">Refresh seats</button>
            <form id="sub-form">
                <button type="submit" id="sub-btn">Confirm</button>
            </form>
        </div>
    </div>
</body>
