<!DOCTYPE html>


<head>
    <link rel="stylesheet" href="search.css">
    <script type="module" src="search.js"></script>
</head>



<body>
    <div class="container_A">
        <form id="main" class="main">
            <input id="bar" placeholder="Search,leave blank to pop a random content you may be interested">
            <button id="m_btn" type="submit">=></button>
        </form>
        <div class="container_A1">
            <div class="container_A1_content">
                <label id="algo-display">Current Algorithm implemented:None</label>
                <label id="time-display">current time 00:00:00 HKT</label>
                <label id="plan-display">current price plan adopted:X</label>
                <div class="container_A1_content_a">
                    <div class="content-display">
                        <article id="carmen">
                            <img src="placeholder.png">
                            <div class="info_container">
                                <h1 data-id="carmen">carmen</h1>
                                <label class="price">Budget price:100hkd</label>
                                <label class="rate">Rate:5.0/10</label>
                                <label class="time">show time:yyyy-mm-dd</label>
                                <label class="duration">duration:1minute</label>
                            </div>
                        </article>
                        <article id="aida">
                            <img src="placeholder.png">
                            <div class="info_container">
                                <h1 data-id="aida">aida</h1>
                                <label class="price">price:carmen's price</label>
                                <label class="rate">Rate:5.0/10</label>
                                <label class="time">show time:yyyy-mm-dd</label>
                                <label class="duration">duration:1minute</label>
                            </div>
                        </article>
                        <article id="rigoletto">
                            <img src="placeholder.png">
                            <div class="info_container">
                                <h1 data-id="rigoletto">rigoletto</h1>
                                <label class="price">price:carmen's price</label>
                                <label class="rate">Rate:5.0/10</label>
                                <label class="time">show time:yyyy-mm-dd</label>
                                <label class="duration">duration:1minute</label>
                            </div>
                        </article>
                        <article id="zauberflote">
                            <img src="placeholder.png">
                            <div class="info_container">
                                <h1 data-id="zauberflote">zauberflote</h1>
                                <label class="price">price:carmen's price</label>
                                <label class="rate">Rate:5.0/10</label>
                                <label class="time">show time:yyyy-mm-dd</label>
                                <label class="duration">duration:1minute</label>
                            </div>
                        </article>
                        <article id="la-traviata">
                            <img src="placeholder.png">
                            <div class="info_container">
                                <h1 data-id="la-traviata">la-traviata</h1>
                                <label class="price">price:carmen's price</label>
                                <label class="rate">Rate:5.0/10</label>
                                <label class="time">show time:yyyy-mm-dd</label>
                                <label class="duration">duration:1minute</label>
                            </div>
                        </article>
                    </div>
                </div>
                <div class="container_A1_content_btn">
                    <button id="btn-prev">previous page</button>
                    <button id="btn-next">next page</button>
                </div>
            </div>
            <div class="container_A1_filter">
                <p class="filter_title">Filter By:</p>
                <div class="price">
                    <p id="p_indicator">price:0</p>
                    <input type="range" id="s_bar" class="s_bar" min="0" max="3000" step="500" value="0">
                    <div class="interval">
                        <span class="p_num">0</span>
                        <span class="p_num">1000</span>
                        <span class="p_num">2000</span>
                        <span class="p_num">3000</span>
                    </div>
                </div>
                <div class="general_filter_box">
                    <p>Name</p>
                    <input type="radio" name=sort id="FilterStatus_name">
                </div>
                <div class="general_filter_box">
                    <p>Time</p>
                    <input type="radio" name=sort id="FilterStatus_time">
                </div>
                <div class="general_filter_box">
                    <p>price</p>
                    <input type="radio" name=sort id="FilterStatus_price">
                </div>
                <div class="general_filter_box">
                    <p>Rate </p>
                    <input type="radio" name=sort id="FilterStatus_rate">
                </div>
                <div class="general_filter_box">
                    <p>Available</p>
                    <input type="radio" name="sort" id="FilterStatus_avail">
                </div>

            </div>
        </div>
    </div>





</body>
