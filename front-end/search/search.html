<!DOCTYPE html>


<head>

    <title>Title?</title>
    <link rel="stylesheet" href="search.css">
    <script type="module" src="search.js"></script>
</head>



<body>
    <div class="container_A">
        <form id="main" class="main">
            <input id="bar" placeholder="Search,leave blank to pop a random content you may be interested">
            <button id="m_btn" type="submit">=></button>
        </form>
        <div class="container_A1">
            <div class="container_A1_content">
                <label id="algo-display">Current Algorithm implemented:None</label>
                <label id="time-display">current time 00:00:00 HKT</label>
                <label id="plan-display">hover on show time to see different time plan</label>
                <div class="container_A1_content_a">
                    <div class="content-display">
                    </div>
                </div>
                <div class="container_A1_content_btn">
                    <button id="btn-prev">previous page</button>
                    <label id="page-num">Current Page:1</label>
                    <button id="btn-next">next page</button>
                </div>
            </div>
            <div class="container_A1_filter">
                <p class="filter_title">Filter By:</p>
                
                <div class="general_filter_box">
                    <p>Name</p>
                    <input type="radio" name=sort id="FilterStatus_name">
                </div>
                <div class="general_filter_box">
                    <p>Time</p>
                    <input type="radio" name=sort id="FilterStatus_time">
                </div>
                <div class="general_filter_box">
                    <p>price</p>
                    <input type="radio" name=sort id="FilterStatus_price">
                </div>
                <div class="general_filter_box">
                    <p>Rate </p>
                    <input type="radio" name=sort id="FilterStatus_rate">
                </div>
                

            </div>
        </div>
    </div>

</body>
