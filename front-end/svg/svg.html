<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Opera Booking - Seat Map</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#f2f4f8;

}

.container{

    display:flex;
    height:100vh;

}

/*==========================================
                Seat Map
==========================================*/

.map_panel{

    flex:3;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    overflow:auto;

}

svg{

    width:980px;

    height:820px;

}

/*==========================================
                Right Panel
==========================================*/

.info_panel{

    flex:1;

    background:#222;

    color:white;

    padding:28px;

    overflow:auto;

}

.info_panel h2{

    margin-bottom:20px;

}

.info_panel h3{

    margin-top:30px;

    margin-bottom:15px;

}

#selectedSeats{

    min-height:220px;

}

.total{

    margin-top:25px;

    font-size:24px;

    color:#FFD54F;

    font-weight:bold;

}

/*==========================================
                Stage
==========================================*/

.stage{

    fill:#2d2d2d;

}

.stage_text{

    fill:white;

    font-size:28px;

    font-weight:bold;

    text-anchor:middle;

}

/*==========================================
            Section Border
==========================================*/

.section{

    fill:none;

    stroke:#9e9e9e;

    stroke-width:2;

    stroke-dasharray:8;

}

.section_title{

    fill:#666;

    font-size:20px;

    text-anchor:middle;

    font-weight:bold;

}

/*==========================================
                Seat
==========================================*/

.seat{

    cursor:pointer;

    stroke:white;

    stroke-width:2;

    transition:.2s;

}

.seat:hover{

    transform:scale(1.18);

    stroke:#222;

}

/*==========================================
            Seat Classes
==========================================*/

.premium{

    fill:#ffca28;

}

.standardHigh{

    fill:#42a5f5;

}

.standardLow{

    fill:#66bb6a;

}

.budget{

    fill:#bdbdbd;

}

.reserved{

    fill:#616161;

    cursor:not-allowed;

}

.selected{

    fill:#e53935!important;

}

/*==========================================
                Legend
==========================================*/

.legend{

    margin-top:20px;

}

.legend_item{

    display:flex;

    align-items:center;

    margin-bottom:12px;

}

.box{

    width:18px;

    height:18px;

    margin-right:10px;

}

.box.p1{

    background:#ffca28;

}

.box.p2{

    background:#42a5f5;

}

.box.p3{

    background:#66bb6a;

}

.box.p4{

    background:#bdbdbd;

}

.box.p5{

    background:#616161;

}

.box.p6{

    background:#e53935;

}

.tooltip{

    position:absolute;

    background:#222;

    color:white;

    padding:8px 12px;

    border-radius:6px;

    font-size:13px;

    display:none;

    pointer-events:none;

    z-index:999;

}

</style>

</head>

<body>

<div class="tooltip" id="tooltip"></div>

<div class="container">

<!-- =======================================
            LEFT
======================================= -->

<div class="map_panel">

<svg
id="seatMap"
viewBox="0 0 980 820">

<!-- Stage -->

<rect

x="250"

y="20"

width="480"

height="60"

rx="15"

class="stage"/>

<text

x="490"

y="58"

class="stage_text">

STAGE

</text>

<!-- Orchestra -->

<path

d="M120 120
Q490 80
860 120
L820 430
Q490 470
160 430
Z"

class="section"/>

<text

x="490"

y="145"

class="section_title">

ORCHESTRA

</text>

<!-- Dress Circle -->

<path

d="M220 490
Q490 450
760 490
L720 640
Q490 670
260 640
Z"

class="section"/>

<text

x="490"

y="515"

class="section_title">

DRESS CIRCLE

</text>

<!-- Upper Circle -->

<path

d="M300 690
Q490 660
680 690
L650 790
Q490 805
330 790
Z"

class="section"/>

<text

x="490"

y="715"

class="section_title">

UPPER CIRCLE

</text>

<!--
Seats will be generated
by JavaScript
-->

<g id="seatLayer"></g>

</svg>

</div>

<!-- =======================================
            RIGHT
======================================= -->

<div class="info_panel">

<h2>

Seat Selection

</h2>

<p>

Click any available seat.

</p>

<h3>

Selected Seats

</h3>

<div id="selectedSeats">

None

</div>

<div class="total">

HK$
<span id="totalPrice">

0

</span>

</div>

<div class="legend">

<div class="legend_item">

<div class="box p1"></div>

Premium

</div>

<div class="legend_item">

<div class="box p2"></div>

Standard High

</div>

<div class="legend_item">

<div class="box p3"></div>

Standard Low

</div>

<div class="legend_item">

<div class="box p4"></div>

Budget

</div>

<div class="legend_item">

<div class="box p5"></div>

Reserved

</div>

<div class="legend_item">

<div class="box p6"></div>

Selected

</div>

</div>

</div>

</div>

<script>

const svg=

document.getElementById("seatLayer");

const tooltip=

document.getElementById("tooltip");

const seatPanel=

document.getElementById("selectedSeats");

const totalPrice=

document.getElementById("totalPrice");

const selected=[];

const priceMap={

premium:880,

standardHigh:680,

standardLow:480,

budget:280

};
/* ==========================================
        Generate Orchestra
========================================== */

generateSection(
    "A",
    8,
    150,
    170,
    38,
    30,
    "premium"
);

generateSection(
    "B",
    10,
    140,
    205,
    36,
    30,
    "premium"
);

generateSection(
    "C",
    12,
    125,
    240,
    35,
    30,
    "standardHigh"
);

generateSection(
    "D",
    14,
    110,
    275,
    35,
    30,
    "standardHigh"
);

generateSection(
    "E",
    16,
    95,
    310,
    35,
    30,
    "standardLow"
);

generateSection(
    "F",
    18,
    80,
    345,
    35,
    30,
    "standardLow"
);

generateSection(
    "G",
    20,
    65,
    380,
    35,
    30,
    "budget"
);

/* ==========================================
        Dress Circle
========================================== */

generateSection(
    "H",
    12,
    240,
    535,
    35,
    28,
    "premium"
);

generateSection(
    "J",
    14,
    215,
    570,
    35,
    28,
    "standardHigh"
);

generateSection(
    "K",
    16,
    190,
    605,
    35,
    28,
    "standardLow"
);

/* ==========================================
        Upper Circle
========================================== */

generateSection(
    "L",
    10,
    310,
    735,
    34,
    26,
    "budget"
);

generateSection(
    "M",
    12,
    285,
    770,
    34,
    26,
    "budget"
);

/* ==========================================
            Generator
========================================== */

function generateSection(

    row,

    seats,

    startX,

    y,

    gap,

    radius,

    type

){

    for(

        let i=0;

        i<seats;

        i++

    ){

        createSeat(

            row,

            i+1,

            startX+i*gap,

            y,

            radius,

            type

        );

    }

}

/* ==========================================
            Seat Factory
========================================== */

function createSeat(

    row,

    number,

    x,

    y,

    r,

    type

){

    const seat=

    document.createElementNS(

        "http://www.w3.org/2000/svg",

        "circle"

    );

    const id=

    row+

    String(number)

    .padStart(2,"0");

    seat.setAttribute(

        "cx",

        x

    );

    seat.setAttribute(

        "cy",

        y

    );

    seat.setAttribute(

        "r",

        r/2.4

    );

    seat.setAttribute(

        "id",

        id

    );

    seat.dataset.id=id;

    seat.dataset.zone=type;

    seat.dataset.price=

    priceMap[type];

    /* ======
        Random Reserved
    ======= */

    if(

        Math.random()<0.12

    ){

        seat.classList.add(

            "seat",

            "reserved"

        );

    }

    else{

        seat.classList.add(

            "seat",

            type

        );

    }

    /* ======
        Hover
    ======= */

    seat.addEventListener(

        "mousemove",

        e=>{

            tooltip.style.display="block";

            tooltip.style.left=

            e.pageX+12+"px";

            tooltip.style.top=

            e.pageY-18+"px";

            tooltip.innerHTML=

            "<b>"+id+"</b><br>"+

            type+"<br>"+

            "HK$"+

            priceMap[type];

        }

    );

    seat.addEventListener(

        "mouseleave",

        ()=>{

            tooltip.style.display="none";

        }

    );

    /* ======
        Click
    ======= */

    seat.addEventListener(

        "click",

        ()=>{

            if(

                seat.classList.contains(

                    "reserved"

                )

            ){

                return;

            }

            toggleSeat(seat);

        }

    );

    svg.appendChild(seat);

}


/* ==========================================
            Toggle Seat
========================================== */

function toggleSeat(seat){

    const id=seat.dataset.id;

    const price=parseInt(

        seat.dataset.price

    );

    const index=

    selected.findIndex(

        item=>item.id===id

    );

    /* ======
        Remove
    ======= */

    if(index!==-1){

        selected.splice(index,1);

        seat.classList.remove(

            "selected"

        );

        seat.classList.add(

            seat.dataset.zone

        );

    }

    /* ======
        Add
    ======= */

    else{

        selected.push({

            id:id,

            price:price,

            zone:seat.dataset.zone

        });

        seat.classList.remove(

            seat.dataset.zone

        );

        seat.classList.add(

            "selected"

        );

    }

    updatePanel();

}

/* ==========================================
            Update Panel
========================================== */

function updatePanel(){

    if(selected.length===0){

        seatPanel.innerHTML=

        "None";

        totalPrice.innerHTML="0";

        return;

    }

    let html="";

    let total=0;

    selected.forEach(item=>{

        total+=item.price;

        html+=`

        <div
        style="
        display:flex;
        justify-content:space-between;
        margin-bottom:8px;
        padding-bottom:6px;
        border-bottom:1px solid #555;
        ">

            <span>

                ${item.id}

            </span>

            <span>

                ${item.zone}

            </span>

            <span>

                HK$${item.price}

            </span>

        </div>

        `;

    });

    seatPanel.innerHTML=html;

    totalPrice.innerHTML=total;

}

/* ==========================================
        Clear Selection
========================================== */

function clearSelection(){

    document

    .querySelectorAll(

        ".selected"

    )

    .forEach(seat=>{

        seat.classList.remove(

            "selected"

        );

        seat.classList.add(

            seat.dataset.zone

        );

    });

    selected.length=0;

    updatePanel();

}

/* ==========================================
        Export Selection
========================================== */

function getSelectedSeats(){

    return selected;

}

/* ==========================================
        Confirm Booking
========================================== */

function confirmBooking(){

    if(selected.length===0){

        alert(

            "Please select at least one seat."

        );

        return;

    }

    localStorage.setItem(

        "selectedSeats",

        JSON.stringify(selected)

    );

    /*
        Replace with your own page
    */

    window.location.href=

    "../pay/pay.html";

}

/* ==========================================
        Optional Buttons
========================================== */

const buttonArea=

document.createElement("div");

buttonArea.style.marginTop="35px";

buttonArea.innerHTML=`

<button
id="clearBtn"
style="
width:100%;
padding:12px;
margin-bottom:12px;
background:#757575;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
">

Clear Selection

</button>

<button
id="confirmBtn"
style="
width:100%;
padding:14px;
background:#43A047;
color:white;
font-size:16px;
font-weight:bold;
border:none;
border-radius:8px;
cursor:pointer;
">

Proceed to Payment

</button>

`;

document

.querySelector(

    ".info_panel"

)

.appendChild(

    buttonArea

);

document

.getElementById(

    "clearBtn"

)

.addEventListener(

    "click",

    clearSelection

);

document

.getElementById(

    "confirmBtn"

)

.addEventListener(

    "click",

    confirmBooking

);

/* ==========================================
        Initialize
========================================== */

updatePanel();

</script>

</body>

</html>
