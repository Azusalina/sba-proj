<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Set New Password</title>
    <script src="resetTrue.js" defer></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 0;
            margin: 0;
        }

        .container {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid black;
            border-radius: 5px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <h1 class="title">Set New Password</h1>
    <div class="container">
        <form id="NewPwdForm">
            <p>New Password</p>
            <input type="password" placeholder="Enter new password" id="pwd" required>
            <input type="password" placeholder="Confirm" id="pwd-confirm" required>
            <br><br>
            <button type="submit">Update Password</button>
        </form>
    </div>
    <p id="StatusDisplay" style="margin-top: 15px; font-weight: bold;"></p>
</body>

</html>
