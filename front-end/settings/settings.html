<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Settings</title>
    <link rel="stylesheet" href="settings.css">
    <script src="settings.js" defer></script>
</head>
<body>
    <h2>Settings</h2>

    <div class="row">
        <label>UID:</label>
        <span id="uid">--</span>
    </div>
    <div class="row">
        <label>ID:</label>
        <span id="id">--</span>
    </div>
    <div class="row">
        <label>Created At:</label>
        <span id="create_at">--</span>
    </div>

    <div class="row" data-field="pwd">
        <label>Password:</label>
        <span class="display-val">********</span>
        <button id="updatePwd-btn">Reset</button>
        <div class="edit-area hidden">
            <input type="password" placeholder="New password" class="input-val">
            <button class="confirm-btn">Confirm</button>
        </div>
    </div>

    <div class="row" data-field="email">
        <label>Email:</label>
        <span class="display-val" id="email">--</span>
        <button id="updateEmail-btn">Update</button>
        <div class="edit-area hidden">
            <input type="email" placeholder="New email" class="input-val">
            <button class="confirm-btn">Confirm</button>
        </div>
    </div>

    <div class="row" data-field="birth">
        <label>Birth Date:</label>
        <span class="display-val" id="birth">--</span>
        <button id="updateBirth-btn">Update</button>
        <div class="edit-area hidden">
            <input type="date" class="input-val">
            <button class="confirm-btn">Confirm</button>
        </div>
    </div>

    <hr class="divider">

    <div class="row wallet-row">
        <label>Wallet Balance:</label>
        <span id="wallet">$0.00</span>
    </div>

    <div class="row redeem-row">
        <label>Redeem Code:</label>
        <form id="redemption" class="redeem-form">
            <input type="text" id="gift-code" placeholder="Enter gift code">
            <button type="submit">Redeem</button>
        </form>
        <label id="redeem-status"></label>
    </div>
</body>
</html>
