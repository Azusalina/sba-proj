<!DOCTYPE html>



<html>
    <head>

        <link rel="preconnect" href="https://fonts.googleapis.com">

        <p class="title">Sign in </p>
        

        <form class="inputs">

            <input id="signin_name" placeholder="name:" class="input_boxes">

            <button id="signin_btn" class="signin_btn" type="submit">sign in</button>
        </form>
        <p id="signin_status" class="signin_status">status:</p>
       <a href="signup_page.html" class="signup_redirection">Dont have an account yet? click here-></a>
