<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="signup.css">
        <script src="signup.js"></script>
        




        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&display=swap" rel="stylesheet">

    </head>

    <body class="overall">

        <p class="title">Sign up an account now</p>

        <form id="form">
            <div class="pair">
                <label for="signup_id">ID:</label>
                <input id="signup_id" type="input" placeholder="ID:">
            </div>
            <div class="pair">
                <label for="signup_email">Email:</label>
                <input id="signup_email" type="input" placeholder="Email:">
            </div>
            <div class="pair">
                <label for="signup_pwd">Password:</label>
                <input id="signup_pwd" type="password" placeholder="Password:">
            </div>
            <button id="signup_btn" type="submit" class="signup_btn">Sign up</button>
        </form>
        <p id="signup_status" class="signup_status">Status:</p>
        <a href="signin_page.html" class="signin_redirection">Already have an account? click here-></a>
        
    </body>















</html>
